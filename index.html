<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CAKRANAKAM — Pesan Dulu, Ambil Saat Siap</title>
<style>
:root{--b:#174EA6;--b2:#2563EB;--y:#FFD84D;--yl:#FFF7D6;--bl:#EAF2FF;--bg:#FFFFFF;--c:#fff;--tx:#172033;--t2:#687386;--ln:#E3E8F2;--bt:#174EA6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:150px;scroll-behavior:smooth}body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--c);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--c);border-bottom:3px solid var(--y)}
.hi{display:flex;align-items:center;gap:10px;padding:8px 14px;max-width:1100px;margin:auto;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--bt);font-size:18px;text-decoration:none}.lg img{width:42px;height:42px;object-fit:contain}
.nv{display:flex;gap:2px;margin-right:auto}.nv a,#bn a{color:var(--tx);text-decoration:none;padding:6px 10px;font-weight:600;border-radius:8px}.nv a.on,#bn a.on{color:var(--bt);background:var(--bl)}
#q{flex:1;min-width:150px;padding:10px 14px;border:1px solid var(--ln);border-radius:99px;background:var(--bl);color:var(--tx);font:inherit}
.cb{position:relative;background:var(--y);color:#172033;border-radius:12px;padding:9px 12px;text-decoration:none;font-weight:700;margin-left:auto}
.bg{background:var(--b);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-left:3px}
.w{max-width:1100px;margin:auto;padding:14px}
.hero{background:linear-gradient(135deg,#fff,var(--bl));color:var(--tx);border:1px solid var(--ln);border-radius:20px;padding:22px;display:grid;grid-template-columns:1.3fr .7fr;gap:12px;align-items:center}
.hero h1{color:var(--bt);margin:0 0 8px;font-size:clamp(26px,5vw,40px);line-height:1.1}.hero img{width:100%;max-width:260px;justify-self:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border-radius:12px;border:0;background:var(--y);color:#172033;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;transition:.15s}.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px #0003}
.btn.o{background:transparent;border:1.5px solid var(--bt);color:var(--bt)}.btn.w{background:#fff;color:var(--bt);border:1.5px solid var(--bt)}
h2{margin:18px 0 8px;color:var(--bt)}.t2,small{color:var(--t2)}
.sc{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.ac,.ch{flex:none;border:1.5px solid var(--ln);background:var(--c);color:var(--tx);border-radius:14px;font:inherit;cursor:pointer;transition:.15s}
.ac{width:92px;padding:10px 4px;font-size:12px;font-weight:600}.ac span{display:block;font-size:24px}.ch{padding:8px 14px;border-radius:99px;white-space:nowrap}
.on.ac,.on.ch{background:var(--yl);color:var(--bt);border-color:var(--b);font-weight:700}.ac:hover,.ch:hover{border-color:var(--b2)}
.sr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 12px}.sr select,.pd select,.pd input,.pd textarea{padding:9px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--c);border:1px solid var(--ln);border-radius:16px;box-shadow:0 1px 4px #1720330d;overflow:hidden}.pd{padding:14px}
.ph{width:100%;height:96px;border:0;background:linear-gradient(135deg,var(--bl),var(--yl));font-size:54px;position:relative;cursor:pointer}
.bd{background:var(--y);color:#172033;border-radius:99px;font-size:11px;padding:3px 9px;font-weight:700}.ph .bd{position:absolute;left:10px;top:10px}
.pd h3{margin:0 0 2px}.pd p{margin:3px 0}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--ln)}.rw b{color:var(--bt)}
.pl{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--y);color:#172033;font-size:22px;font-weight:700;cursor:pointer}
.pd>.btn{width:100%;margin-top:8px}
.em{text-align:center;padding:40px 14px}.em>div{font-size:56px}
.ci{display:flex;justify-content:space-between;gap:8px;padding:12px;margin-bottom:8px;align-items:center}
.qt{display:flex;align-items:center;gap:6px}.qt button{width:34px;height:34px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);cursor:pointer;font-size:16px}
.sm{padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px;margin:10px 0}.tt{font-size:20px;color:var(--bt)}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;align-items:start}
.pd label{display:block;font-weight:600;margin-top:10px}.pd input:not([type=radio],[type=checkbox]),.pd textarea,.pd select{width:100%}.er{color:#B42318;font-size:13px;display:block;min-height:0}
fieldset{border:1px solid var(--ln);border-radius:12px;margin:8px 0}.op{display:flex!important;gap:8px;align-items:center;font-weight:400!important;margin:4px 0!important}.op b{margin-left:auto}
.bk{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.md{background:var(--c);color:var(--tx);border-radius:18px;padding:18px;max-width:480px;width:100%;max-height:88vh;overflow:auto;position:relative}.md h3{margin:0 24px 8px 0}
.x{position:absolute;right:10px;top:10px;border:0;background:none;color:var(--tx);font-size:18px;cursor:pointer}.ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
#t{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:var(--b);color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:60;pointer-events:none}#t.on{opacity:1;transform:translate(-50%,0)}
.sk{height:300px;border-radius:16px;background:linear-gradient(90deg,var(--bl),var(--c),var(--bl));background-size:200% 100%;animation:sk 1s infinite}@keyframes sk{to{background-position:-200% 0}}
.s{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--bl);color:var(--bt)}.s0{background:var(--yl);color:var(--tx)}.s4{background:#DDF3E4;color:#17603A}.s5{background:var(--ln);color:var(--t2)}
.rw2{display:flex;gap:8px;padding:10px;margin-bottom:8px;align-items:center;flex-wrap:wrap}.rw2 input,.rw2 select{padding:8px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;flex:1;min-width:110px}
.dh{display:flex;gap:14px;align-items:center;margin:8px 0}.big{font-size:60px}.warn{background:var(--yl);padding:10px 14px;border-radius:12px;margin:8px 0}
footer{text-align:center;color:var(--t2);font-size:13px;padding:20px 14px}
#bn{display:none;position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);background:var(--c);border-top:1px solid var(--ln);justify-content:space-around;padding:6px;z-index:11}#bn a{text-align:center;font-size:12px;flex:1}
@media(max-width:720px){.nv{display:none}#bn{display:flex}.hero{grid-template-columns:1fr}.hero img{max-width:170px;grid-row:1}.cols{grid-template-columns:1fr}.cb{margin-left:auto}}
</style></head><body>

const CG={cn:(t,v)=>{C(v).n=t.value.trim()||C(v).n;sd()},ca:(t,v)=>{C(v).a=t.value;sd()},mp:(t,v)=>{const[c,i]=v.split(':');IT(c,i).p=Math.max(0,+t.value||0);sd()},mo:(t,v)=>{const[c,i]=v.split(':');IT(c,i).on=t.checked?1:0;sd()},ac:t=>{S.ac=t.value;rr()},ao:t=>{S.ao=t.value;rr()},os:(t,v)=>{orders.find(o=>o.code==v).st=+t.value;so()}};

re:d=>{const o=orders.find(x=>x.code==d.v),c=C(o.cid);if(!c)return toast('Kantin ini sudah tidak tersedia');const go=()=>{let ok=0,no=0;o.items.forEach(i=>{const m=IT(o.cid,i.id);if(!m||!m.on){no++;return}const k=i.id+'|'+i.o,x=cart.find(y=>y.k==k);x?x.q+=i.q:cart.push({k,cid:o.cid,id:i.id,n:i.n,o:i.o,p:i.p,q:i.q});ok++});sc2();toast(no?`${ok} item dimasukkan, ${no} sudah tidak tersedia`:'Pesanan dimasukkan ke keranjang');ok&&(location.hash='keranjang')};cart.length&&cart[0].cid!=o.cid?conflict(go):go()},
at:d=>{S.at=d.v;rr()},dc:d=>{DB=DB.filter(c=>c.id!=d.v);cart=cart.filter(i=>i.cid!=d.v);sc2();sd()},dm:d=>{const[c,i]=d.v.split(':'),k=C(c);k.m=k.m.filter(m=>m.id!=i);sd()},rd:()=>{DB=gen();cart=[];sc2();sd();toast('Data contoh direset')}};
